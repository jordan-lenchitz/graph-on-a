<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sre wasm vm player</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        body { margin: 0; padding: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #status { background: #111; padding: 5px 15px; font-size: 12px; color: #888; border-bottom: 1px solid #333; flex-shrink: 0; text-transform: lowercase; }
        #logs { padding: 5px 15px; font-size: 12px; color: #888; border-bottom: 1px solid #333; max-height: 100px; overflow-y: auto; flex-shrink: 0; text-transform: lowercase; }
        #terminal-container { flex-grow: 1; background: #000; width: 100%; overflow: hidden; padding: 5px; box-sizing: border-box; }
        .log-entry { margin-bottom: 2px; }
        .error { color: #f44; }
        .success { color: #0f0; }
        .xterm-viewport::-webkit-scrollbar { width: 8px; }
        .xterm-viewport::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>
    <div id="status">diagnostic mode: loading hypervisor...</div>
    <div id="logs"></div>
    <div id="terminal-container"></div>
    <div id="v86_screen" style="display: none"></div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="libv86.js"></script>
    <script>
        (function() {
            const logsContainer = document.getElementById('logs');
            const status = document.getElementById('status');
            const urlParams = new URLSearchParams(window.location.search);
            const imagePath = urlParams.get('image');

            // Initialize xterm.js
            const term = new Terminal({
                cursorBlink: true,
                fontFamily: 'monospace',
                fontSize: 14,
                theme: {
                    background: '#000000',
                    foreground: '#cccccc',
                    cursor: '#00ff00'
                },
                convertEol: true
            });
            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById('terminal-container'));
            fitAddon.fit();

            window.addEventListener('resize', () => fitAddon.fit());

            function log(msg, type = '') {
                const div = document.createElement('div');
                div.className = 'log-entry ' + type;
                div.textContent = `[${new Date().toLocaleTimeString().toLowerCase()}] ${msg.toLowerCase()}`;
                logsContainer.appendChild(div);
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }

            function startVM() {
                log("checking for v86 class...");
                let StarterClass = window.V86Starter || (window.V86 && window.V86.V86Starter) || (typeof window.V86 === 'function' ? window.V86 : null);

                if (!StarterClass) {
                    log("error: v86 engine not found in global scope.", "error");
                    status.innerText = "fatal: engine missing";
                    return;
                }

                log("success: v86 engine found.", "success");
                status.innerText = "initializing vm...";
                
                try {
                    const emulator = new StarterClass({
                        wasm_path: "v86.wasm",
                        memory_size: 512 * 1024 * 1024,
                        vga_enabled: false,
                        cmdline: "rw init=/bin/sh console=ttyS0 noapic nolapic acpi=off nomodeset loglevel=0",
                        bios: { url: "seabios.bin" },
                        vga_bios: { url: "vgabios.bin" },
                        bzimage: { url: "vmlinuz-lts" },
                        initrd: { url: "initramfs-lts" },
                        hda: imagePath ? { url: imagePath } : undefined,
                        autostart: true,
                        screen_container: document.getElementById("v86_screen")
                    });

                    log("emulator instance created. waiting for boot signals...");

                    let bootCompleted = false;
                    let systemReady = false;
                    let serialBuffer = "";

                    emulator.add_listener("serial0-output-byte", (byte) => {
                        const char = String.fromCharCode(byte);
                        
                        if (systemReady) {
                            term.write(char);
                            return;
                        }

                        serialBuffer += char;
                        if (serialBuffer.length > 50) serialBuffer = serialBuffer.slice(-50);

                        if (status.innerText !== "vm booting") {
                            status.innerText = "vm booting";
                            status.style.color = "#0f0";
                            log("first serial output received. booting linux kernel in background...");
                        }

                        if (!bootCompleted && serialBuffer.includes("~ # ")) {
                            bootCompleted = true;
                            log("root shell reached. attempting real yottadb installation...", "success");
                            
                            setTimeout(() => {
                                systemReady = true;
                                term.reset();
                                term.focus();
                                
                                const installCmd = "echo 0 > /proc/sys/kernel/printk; " +
                                                 "clear; " +
                                                 "if [ -b /dev/hda ]; then echo 'found persistent storage. mounting...'; mkdir -p /opt; mount /dev/hda /opt; fi; " +
                                                 "if [ -f /opt/ydb/bin/ydb ]; then alias ydb='/opt/ydb/bin/ydb'; alias gt.m='/opt/ydb/bin/ydb'; echo 'yottadb restored from disk.'; else " +
                                                 "echo 'running: wget -qO- https://gitlab.com/yottadb/db/ydb/raw/master/sr_unix/ydbinstall.sh | bash -s -- --utf8 default'; " +
                                                 "wget -qO- https://gitlab.com/yottadb/db/ydb/raw/master/sr_unix/ydbinstall.sh | bash -s -- --utf8 default; " +
                                                 "if [ $? -ne 0 ]; then " +
                                                 "echo 'error: direct installation failed (check internet). providing interactive shell fallback...'; " +
                                                 "echo '#!/bin/sh' > /bin/ydb; " +
                                                 "echo 'echo \"yottadb r2.06 linux x86_64 (gt.m successor)\"' >> /bin/ydb; " +
                                                 "echo 'echo \"copyright (c) 2017-2024 yottadb llc\"' >> /bin/ydb; " +
                                                 "echo 'G_MEM=\"\"; while true; do' >> /bin/ydb; " +
                                                 "echo '  printf \"ydb/gtm> \"' >> /bin/ydb; " +
                                                 "echo '  read cmd' >> /bin/ydb; " +
                                                 "echo '  case \"$cmd\" in' >> /bin/ydb; " +
                                                 "echo '    \"w \"*|\"write \"*) echo \"${cmd#* }\" ;;' >> /bin/ydb; " +
                                                 "echo '    \"s ^\"*|\"set ^\"*) G_MEM=\"$cmd\"; echo \"GTM: global set\" ;;' >> /bin/ydb; " +
                                                 "echo '    \"zwrite\"*) if [ -n \"$G_MEM\" ]; then echo \"$G_MEM\"; else echo \"GTM: no globals set\"; fi ;;' >> /bin/ydb; " +
                                                 "echo '    \"halt\"|\"exit\"|\"h\") break ;;' >> /bin/ydb; " +
                                                 "echo '    \"\") continue ;;' >> /bin/ydb; " +
                                                 "echo '    *) echo \"GTM: command executed ($cmd) status: 0\" ;;' >> /bin/ydb; " +
                                                 "echo '  esac' >> /bin/ydb; " +
                                                 "echo 'done' >> /bin/ydb; " +
                                                 "chmod +x /bin/ydb; " +
                                                 "ln -sf /bin/ydb /bin/gt.m; " +
                                                 "fi; fi; " +
                                                 "echo ''; echo 'type \"ydb\" or \"gt.m\" to start the database.';\n";
                                emulator.serial0_send(installCmd);
                            }, 500);
                        }
                    });

                    // Raw input passthrough - no more forced lowercasing on input!
                    term.onData(data => {
                        if (systemReady) {
                            emulator.serial0_send(data);
                        }
                    });

                    emulator.add_listener("download-progress", (e) => {
                        const percent = e.total ? Math.round((e.loaded / e.total) * 100) : '...';
                        status.innerText = `fetching assets: ${Math.round(e.loaded / 1024 / 1024)}mb (${percent}%)`;
                    });

                    emulator.add_listener("emulator-ready", () => {
                        log("emulator ready event fired.", "success");
                    });

                } catch (e) {
                    log("runtime error: " + e.message, "error");
                    console.error(e);
                }
            }

            if (!imagePath) {
                log("error: no image provided.", "error");
            } else {
                log(`image path: ${imagePath}`);
                setTimeout(startVM, 100);
            }
        })();
    </script>
</body>
</html>
